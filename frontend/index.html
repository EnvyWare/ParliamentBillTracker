<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The application requires no third-party runtime origin at all: no remote
      font, analytics script, image or chart library. connect-src is limited to
      the origin the app is served from, which is where /data/current.json also
      lives. 'unsafe-inline' for style-src is required because Vite inlines a
      small amount of critical CSS; no inline script is permitted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="An unofficial, independent view of where every Bill in the current UK Parliament session sits on its route through Parliament."
    />
    <meta name="robots" content="index, follow" />
    <title>UK Bill Pipeline — where every Bill sits in Parliament</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui, sans-serif">
        UK Bill Pipeline needs JavaScript to display the process chart. The underlying data is
        published as a single JSON file at
        <a href="/data/current.json">/data/current.json</a>, and the original source is the
        <a href="https://bills-api.parliament.uk/api/v1">UK Parliament Bills API</a>. This is an
        independent, unofficial project and is not affiliated with or endorsed by UK Parliament.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
