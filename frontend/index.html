<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The application requires no third-party runtime origin at all: no remote
      font, analytics script, image or chart library. The brand faces are
      self-hosted, so font-src 'self' is a real constraint rather than a
      formality: a stylesheet that reached for Google Fonts would fail here
      rather than quietly adding a third-party request. connect-src is limited
      to the origin the app is served from, which is where /data/current.json
      also lives. 'unsafe-inline' for style-src is required because Vite inlines a
      small amount of critical CSS; no inline script is permitted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    />
    <!-- Dark is the brand default; the Cream theme is served only where the
         system asks for light. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#120C0A" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Preloaded, not merely declared. Without this the fallback paints first
      and the swap to Poppins reflows every heading, which showed up as 0.22
      cumulative layout shift against a budget of 0.1. The version in each
      filename is what makes a one-year immutable cache safe: a new cut of the
      font is a new URL.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin-v20.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/poppins-latin-v24.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <meta
      name="description"
      content="An unofficial, independent view of where every Bill in the current UK Parliament session sits on its route through Parliament."
    />
    <meta name="robots" content="index, follow" />
    <title>UK Bill Pipeline — where every Bill sits in Parliament | EnvyWare</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui, sans-serif">
        UK Bill Pipeline, by EnvyWare, needs JavaScript to display the process chart. The underlying data is
        published as a single JSON file at
        <a href="/data/current.json">/data/current.json</a>, and the original source is the
        <a href="https://bills-api.parliament.uk/api/v1">UK Parliament Bills API</a>. This is an
        independent, unofficial project and is not affiliated with or endorsed by UK Parliament.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
