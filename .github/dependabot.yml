# Dependency updates.
#
# Weekly rather than daily, and grouped rather than one pull request per
# package: this repository has a small dependency surface and a full CI run per
# update is the expensive part, not the review.

version: 2
updates:
  # GitHub Actions are pinned to commit SHAs. Dependabot understands the
  # `# v1.2.3` comment convention and rewrites both the SHA and the comment,
  # which is the only practical way to keep SHA pinning maintainable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Separated because a React or Vite major is a real change to review,
      # while a batch of type definitions and lint rules is not.
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: terraform
    directory: /infra/environments/prod
    schedule:
      interval: weekly
    commit-message:
      prefix: infra

  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
    commit-message:
      prefix: infra
