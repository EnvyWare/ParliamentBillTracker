name: CI

# Runs on every pull request, and as the gate the deploy workflow calls. No
# AWS credentials are needed or requested: everything here is static
# analysis, unit tests, or Terraform validation against mocked providers.
#
# Third-party actions are pinned to commit SHAs rather than tags, because a
# tag can be moved to point at different code.

on:
  pull_request:
  workflow_dispatch:
  # Deployment reuses this workflow rather than restating the gates, so the
  # checks that guard a pull request are exactly the checks that guard a
  # release. There is deliberately no `push` trigger for main: the deploy
  # workflow calls this one, and a second copy running alongside it would
  # duplicate every job and fight it for the concurrency group.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the *calling* workflow's name for a reusable workflow,
  # so a deployment and a pull request never share a group.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request push is a saving. Cancelling half-way through
  # the gate that guards a release is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.13'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Ruff lint
        run: ruff check .
        working-directory: backend

      - name: Ruff format
        run: ruff format --check .
        working-directory: backend

      - name: Type check
        run: mypy
        working-directory: backend

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
        working-directory: backend

      - name: The example snapshot matches its generator
        run: python scripts/build_synthetic_snapshot.py --check

      - name: The stage mapping documentation matches the table
        run: python scripts/generate_stage_mapping_docs.py --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Format
        run: npm run format:check
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Tests
        run: npm run test
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend

  end-to-end:
    name: End to end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Runs against the production build, including axe checks at every
      # target viewport and the bundle-size budgets.
      - name: Playwright
        run: npm run test:e2e
        working-directory: frontend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.0'
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff infra

      # -backend=false so no AWS credentials or state bucket are involved.
      - name: Validate
        run: |
          for dir in infra/bootstrap infra/environments/prod; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      # Policy tests run against a plan with mocked providers, so they assert
      # real resource attributes without touching an account.
      - name: Policy tests
        run: |
          for dir in infra/modules/static_delivery infra/modules/ingestion infra/environments/prod; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
          done

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

      # Absence cannot be asserted from a plan, so the "must not exist" rules
      # are checked statically: no NAT Gateway, no database, no API Gateway,
      # no S3 website hosting, and so on.
      - name: Infrastructure policy
        run: python scripts/check_infra_policy.py

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          exit-code: '1'
          severity: HIGH,CRITICAL
          trivy-config: .trivy.yaml

  repository:
    name: Licensing and hygiene
    runs-on: ubuntu-latest

    env:
      # Bump both together. Checksums are published alongside each release at
      # https://github.com/gitleaks/gitleaks/releases. Dependabot does not
      # track this, because it is a downloaded binary rather than a dependency
      # in an ecosystem it understands, so it is a manual bump.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: gitleaks below scans every commit, so a secret that
          # was committed and later deleted is still found. A shallow clone
          # would quietly reduce that to "the current tip is clean".
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The gitleaks binary, deliberately not gitleaks/gitleaks-action: that
      # action requires a paid GITLEAKS_LICENSE for organisation-owned
      # repositories and fails the run without one. The scanner itself is MIT.
      #
      # Checksum-verified, because this step downloads an executable and runs
      # it over the whole repository.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
          gitleaks version

      # `gitleaks git` scans committed content, which is the right scope: a
      # directory scan also walks .venv and node_modules, where sample keys in
      # installed packages produce around a hundred findings that are not in
      # this repository and never will be.
      #
      # --redact so that a real finding is not reprinted into a public log.
      - name: Scan the history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

      # Checks that the Open Parliament Licence attribution and the unofficial
      # disclaimer are present in the licence files, the README and the
      # rendered footer, and that no state or credential-shaped file would be
      # committed.
      - name: Repository checks
        run: python scripts/check_repository.py
