# gitleaks configuration.
#
# The default ruleset does the heavy lifting; this file only extends it.

[extend]
useDefault = true

# gitleaks 8.30's default rules do not flag a bare AWS access key ID. That is
# defensible in general - an AKIA identifier is not itself a credential, and on
# its own it cannot authenticate anything - but this repository deploys to AWS
# and nothing here should ever contain one. A leaked key ID also names the
# account and narrows an attacker's search, so it is treated as a finding.
[[rules]]
id = "aws-access-key-id"
description = "AWS access key ID"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16})\b'''
keywords = ["AKIA", "ASIA", "ABIA", "ACCA", "A3T"]

  [rules.allowlist]
  # scripts/check_repository.py carries the same pattern as a regex literal in
  # order to catch this case itself. The pattern is not a key.
  paths = ['''scripts/check_repository\.py''']
